name: deanery-cifry
# Local work: `docker compose up -d db`, then `npm run db:setup` applies the migrations.
# The app service is optional (`docker compose up -d --build`); it reads the same database.
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://deanery:${POSTGRES_PASSWORD:-deanery-local-only}@db:5432/deanery
    ports:
      - "127.0.0.1:${APP_PORT:-3002}:3000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: deanery
      POSTGRES_USER: deanery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deanery-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U deanery -d deanery"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db_data:
